<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONDOBLOX Map Live — By Princess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #ff5fa2;
    --pink-soft: rgba(255,95,162,.55);
    --pink-glow: rgba(255,95,162,.35);
    --red: #ff3b3b;
    --green: #4ade80;
    --bg: #050307;
    --card: rgba(18,10,20,.72);
    --border: rgba(255,95,162,.18);
    --text: #f6eef4;
    --muted: #b9a8b6;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }

  /* ===== Heart Particles & Ambient ===== */
  #hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55;}
  body::before{
    content:"";position:fixed;inset:-20%;
    background:radial-gradient(circle at 20% 80%, rgba(255,95,162,.10), transparent 45%),
               radial-gradient(circle at 80% 20%, rgba(255,95,162,.08), transparent 45%);
    pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(2%,-2%) scale(1.05);}}

  /* ===== Header ===== */
  .brand{position:relative;z-index:2;text-align:center;margin-bottom:22px;animation:fadeDown .8s ease both;}
  .brand .tag{
    display:inline-block;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;
    color:var(--pink);border:1px solid var(--border);padding:6px 14px;border-radius:999px;
    background:rgba(255,95,162,.06);margin-bottom:12px;text-transform:uppercase;
  }
  .brand h1{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.4rem,5vw,2.5rem);
    letter-spacing:1px;background:linear-gradient(90deg,#fff 0%,#ffb8d3 50%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px var(--pink-glow);
  }
  .brand p{color:var(--muted);font-size:11px;letter-spacing:4px;margin-top:8px;text-transform:uppercase;font-family:'Orbitron',sans-serif;}

  /* ===== Main Container ===== */
  .main-container{position:relative;z-index:2;width:100%;max-width:960px;display:flex;flex-direction:column;gap:16px;}

  /* ===== Live Card (Video) ===== */
  .live-card{
    background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 80px rgba(255,95,162,.06);
    animation:fadeUp .9s ease both;
  }
  
  .video-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
  .video-title{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--text);font-weight:700;letter-spacing:1px;}
  .live-tag{
    display:flex;align-items:center;gap:6px;font-family:'Orbitron',sans-serif;font-size:10px;
    font-weight:700;color:var(--red);border:1px solid rgba(255,59,59,.4);padding:4px 10px;border-radius:20px;
    text-transform:uppercase;letter-spacing:1px;background:rgba(255,59,59,.1);
  }
  .live-tag .dot-live{width:6px;height:6px;background:var(--red);border-radius:50%;box-shadow:0 0 8px var(--red);animation:pulse 1.2s infinite;}

  .player-wrap{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;
    box-shadow:0 0 0 1px rgba(255,95,162,.12) inset;cursor:pointer;
  }
  .player-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

  /* Play Overlay & Badges */
  .play-overlay{
    position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at center,rgba(0,0,0,.35),rgba(0,0,0,.75));transition:opacity .4s ease;
  }
  .play-overlay.hidden{opacity:0;pointer-events:none;}
  .play-btn{
    width:88px;height:88px;border-radius:50%;border:1.5px solid var(--pink-soft);background:rgba(255,95,162,.1);
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px var(--pink-glow);
    transition:transform .25s ease,background .25s ease;
  }
  .play-overlay:hover .play-btn{transform:scale(1.08);background:rgba(255,95,162,.18);}
  .play-btn svg{width:34px;height:34px;fill:var(--pink);margin-left:4px;}

  .live-texts{position:absolute;top:14px;right:14px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;}
  .live-texts span{
    font-family:'Orbitron',sans-serif;font-size:clamp(8px,1.6vw,10px);font-weight:700;letter-spacing:1px;
    color:var(--red);text-shadow:0 0 8px rgba(255,59,59,.75);background:rgba(0,0,0,.45);
    padding:4px 8px;border-radius:6px;backdrop-filter:blur(3px);animation:blink 2.4s infinite;
  }
  .live-texts span:nth-child(2){animation-delay:.8s;}
  .live-texts span:nth-child(3){animation-delay:1.6s;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.55;}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.6;}}

  /* ===== Info Bar (Player Counter) ===== */
  .info-bar{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px 20px;
    backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fadeUp 1s ease both;
  }
  .players{display:flex;align-items:center;gap:12px;}
  .players .icon{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite;}
  .players #playerCount{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;color:#fff;transition:color .2s ease;}
  .players .label{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-family:'Orbitron',sans-serif;}
  
  /* ===== Join Button ===== */
  .join-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;
    font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:2px;font-weight:700;
    color:#fff;text-decoration:none;text-transform:uppercase;
    background:linear-gradient(135deg,rgba(255,95,162,.15),rgba(255,95,162,.05));
    border:1.5px solid var(--pink-soft);box-shadow:0 0 20px rgba(255,95,162,.2);
    transition:all .3s ease;position:relative;overflow:hidden;animation:fadeUp 1.1s ease both;
  }
  .join-btn::before{
    content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);
    transform:translateX(-100%);transition:transform .6s ease;
  }
  .join-btn:hover::before{transform:translateX(100%);}
  .join-btn:hover{box-shadow:0 0 35px rgba(255,95,162,.4);transform:translateY(-2px);}
  .join-btn svg{width:18px;height:18px;fill:var(--pink);}

  /* ===== Fake Chat (Live Comments) ===== */
  .chat-panel{
    background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;
    backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fadeUp 1.2s ease both;
  }
  .chat-title{
    font-family:'Orbitron',sans-serif;font-size:11px;color:var(--pink);letter-spacing:2px;
    text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;
  }
  .chat-box{height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;}
  .chat-box::-webkit-scrollbar{display:none;}
  .chat-msg{
    font-size:12px;line-height:1.4;animation:slideIn .3s ease-out;
    background:rgba(255,255,255,.03);padding:8px 12px;border-radius:8px;border-left:2px solid var(--pink-soft);
  }
  .chat-msg .user{color:var(--pink);font-weight:700;margin-right:6px;font-family:'Orbitron',sans-serif;font-size:11px;}
  .chat-msg .text{color:var(--text);}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* Footer */
  footer{position:relative;z-index:2;margin-top:28px;font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-family:'Orbitron',sans-serif;text-align:center;}
  footer b{color:var(--pink);font-weight:700;}

  @keyframes fadeDown{from{opacity:0;transform:translateY(-15px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<canvas id="hearts"></canvas>

<header class="brand">
  <span class="tag">● Live Stream</span>
  <h1>CONDOBLOX Map Live</h1>

<main class="main-container">

    <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14h-7v2h7v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg> Join Map

  <!-- 4. Fake Chat Section -->

<footer>© <b>CONDOBLOX By Princess</b> — All Rights Reserved</footer>

<script>
(function(){
  'use strict';

  /* ===== 1. HEART PARTICLES (Efek Pink) ===== */
  const canvas = document.getElementById('hearts');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, dpr=Math.min(window.devicePixelRatio||1,2), hearts=[], rafId=null;

  function resizeCanvas(){
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count=Math.min(26,Math.max(12,Math.floor(W/55)));
    hearts=[]; for(let i=0;i<count;i++) hearts.push(makeHeart(true));
  }
  function makeHeart(init){
    return {x:Math.random()*W, y:init?Math.random()*H:H+20, size:6+Math.random()*10, speed:0.4+Math.random()*0.9,
      sway:Math.random()*Math.PI*2, swaySpeed:0.008+Math.random()*0.012, swayAmp:0.4+Math.random()*0.8,
      alpha:0.08+Math.random()*0.18, rot:Math.random()*Math.PI*2};
  }
  function drawHeart(x,y,s,alpha,rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/16,s/16); ctx.globalAlpha=alpha; ctx.fillStyle='#ff5fa2';
    ctx.beginPath(); ctx.moveTo(0,4); ctx.bezierCurveTo(0,0,-6,-4,-10,0); ctx.bezierCurveTo(-16,6,-6,14,0,18);
    ctx.bezierCurveTo(6,14,16,6,10,0); ctx.bezierCurveTo(6,-4,0,0,0,4); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function animHearts(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<hearts.length;i++){
      const h=hearts[i]; h.y-=h.speed; h.sway+=h.swaySpeed; h.rot+=0.005;
      drawHeart(h.x+Math.sin(h.sway)*(h.swayAmp*12), h.y, h.size, h.alpha, h.rot);
      if(h.y<-30) hearts[i]=makeHeart(false);
    }
    rafId=requestAnimationFrame(animHearts);
  }
  resizeCanvas(); animHearts();
  window.addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(resizeCanvas,180);},{passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=null;}}
    else{if(!rafId)rafId=requestAnimationFrame(animHearts);}
  });

  /* ===== 2. VIDEO PLAYER ===== */
  const video = document.getElementById('liveVideo');
  const overlay = document.getElementById('playOverlay');
  const playerWrap = document.getElementById('playerWrap');

  playerWrap.addEventListener('click', function(){
    if (video.paused) {
      video.muted = false;
      video.play().then(()=>{overlay.classList.add('hidden');}).catch(()=>{
        video.muted = true;
        video.play();
        overlay.classList.add('hidden');
      });
    } else {
      video.pause();
      overlay.classList.remove('hidden');
    }
  });

  // Auto play muted pas load
  window.addEventListener('load', ()=>{
    video.play().then(()=>{overlay.classList.add('hidden');}).catch(()=>{});
  });

  /* ===== 3. PLAYER COUNTER 15.000 (Naik Turun 20%) ===== */
  const counterEl = document.getElementById('playerCount');
  let count = 15000;
  function tickCounter(){
    const change = Math.floor(Math.random() * 101) - 50; // -50 s/d +50
    count += change;
    // Range: 12.000 s/d 18.000 (20% dari 15.000)
    if(count > 18000) count = 18000 - Math.floor(Math.random()*50);
    if(count < 12000) count = 12000 + Math.floor(Math.random()*50);
    
    counterEl.textContent = count.toLocaleString('id-ID');
    setTimeout(tickCounter, 800 + Math.random() * 1700); // Jeda 0.8s - 2.5s
  }
  setTimeout(tickCounter, 1500);

  /* ===== 4. FAKE LIVE CHAT ===== */
  const chatBox = document.getElementById('chatBox');
  const users = ["Budi_Sigma", "Siti_Hot", "Rian_Gamer", "Princess_", "Choso_", "Dinda_Cantik", "Valzz", "Zacky", "Nana", "Yanto", "Kevin", "Alfi", "Cewe_Nakal", "Rafa", "Tono", "Jaka", "Bella", "Lia", "Queen_", "Baddie"];
  const comments = [
    "wow keren bgt mapnya", "hot nih livenya", "good job min", "bad girl bgt ini", "njir rame bgt",
    "join join", "cakep banget", "keren parah", "mantap jiwa", "kok bisa 15rb?",
    "asli rame bgt", "ini real atau fake?", "player barunya ramah gak?", "gw baru nyampe", "wih ada live",
    "min, link privatnya", "bagus banget", "keren keren", "gila sih ini", "mantap pisan euy",
    "anjay keren", "join ah", "map nya unik", "pink nya aesthetic", "gokil",
    "hot girl disini?", "wkwkwk rame", "ada yg mau mabar?", "gw follow ya", "live terus min",
    "kerenn", "suka bgt", "bagus tampilannya", "parah sih", "mantab",
    "join map nya gmn?", "cek dm min", "asli gak nih?", "mantap bang", "keren abis",
    "keren bgt sumpah", "hot bgt nih", "good", "bad girl mana suaranya?", "wow wow wow",
    "nice", "great", "epic", "keren banget sumpah", "love it",
    "suka suka suka", "bagus bagus bagus", "kereeen", "mantul", "josss",
    "gila keren bgt", "hot hot hot", "bad girl", "wow banget", "sumpah keren",
    "gila sih", "parah kerennya", "mantap betul", "wih rame", "anjir rame bgt",
    "keren parah", "top banget", "keren keren", "good job", "bad girl",
    "wow amazing", "keren sekali", "bagus banget", "mantap", "keren bgt sih",
    "suka", "hot", "wow", "good", "bad girl", "keren", "mantap", "bagus", "keren banget",
    "wow", "good", "bad girl", "keren bgt", "mantap", "bagus", "keren banget",
    "wow", "good", "bad girl", "keren", "mantap", "bagus", "keren banget", "wow", "good", "bad girl"
  ];

  function addChat(){
    const u = users[Math.floor(Math.random() * users.length)];
    const c = comments[Math.floor(Math.random() * comments.length)];
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="user">${u}</span><span class="text">${c}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    
    // Bersihin chat lama biar gak berat (maksimal 30 chat di layar)
    if(chatBox.children.length > 30) {
      chatBox.removeChild(chatBox.firstChild);
    }
    setTimeout(addChat, 500 + Math.random() * 1500);
  }
  
  // Start chat
  setTimeout(addChat, 1000);
  setTimeout(addChat, 2000);

})();
</script>
</body>
